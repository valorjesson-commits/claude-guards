name: Hook tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify jq
        run: jq --version

      - name: Run hook self-tests
        run: |
          sh hooks/refuse-detached-bash.test.sh
          sh hooks/require-subagent-model.test.sh
